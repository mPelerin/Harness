# Le dépôt est le dossier du projet : l'appli vit dans code/, d'où « root » sur chaque commande.
# Hooks Git du projet, lancés par Lefthook.
# Avant un commit : format et lint, sur les seuls fichiers du commit.
# Avant un push : la vérification complète.

pre-commit:
  commands:
    format:
      root: "code/"
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,css,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      root: "code/"
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: npx eslint {staged_files}

pre-push:
  commands:
    verifier:
      root: "code/"
      run: npm run verifier
