name: Structure du dépôt
on:
  push:
    branches: [main, preprod]
  pull_request:
    branches: [main, preprod]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Vérifier les modèles et le README
        run: |
          test -s README.md
          test -s .github/ISSUE_TEMPLATE/fonction.md
          test -s .github/PULL_REQUEST_TEMPLATE.md
