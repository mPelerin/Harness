# Règles de gitleaks pour ce dépôt : les règles de base, plus des règles d'adresse.
# Le dépôt est public : aucune adresse privée, aucune adresse Tailscale, aucun e-mail.

[extend]
useDefault = true

[[rules]]
id = "ip-privee"
description = "Adresse IPv4 privée (10/8, 172.16/12, 192.168/16)"
regex = '''\b(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2})\b'''

[[rules]]
id = "ip-tailscale"
description = "Adresse Tailscale (IPv4 100.64/10, IPv6 fd7a:115c:a1e0::/48)"
regex = '''(?i)\b(?:100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])(?:\.\d{1,3}){2}|fd7a:115c:a1e0(?::[0-9a-f]{0,4}){1,5})\b'''

[[rules]]
id = "e-mail"
description = "Adresse e-mail"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''

[[allowlists]]
description = "Adresses génériques permises"
regexTarget = "match"
regexes = [
  '''noreply@anthropic\.com''',
  '''git@github\.com''',
  '''@example\.(?:com|org)''',
]
